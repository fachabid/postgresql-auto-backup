backupDir: /var/backups/postgresql
retentionDays: 30

instances:
  - id: pg14
    host: localhost
    port: 5432
    user: postgres
    password: change_me
    databases: [ile_db, test_vector_db]
    backupRoles: false
    bin:
      pgDump: /usr/lib/postgresql/14/bin/pg_dump
      pgDumpall: /usr/lib/postgresql/14/bin/pg_dumpall
      psql: /usr/lib/postgresql/14/bin/psql

  - id: pg16
    host: localhost
    port: 5433
    user: postgres
    password: change_me
    databases: [app_new]
    version: 16
